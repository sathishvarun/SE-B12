name: bdx-insight tests

on:
  push:
    paths: ["bdx-insight-ai/**", ".github/workflows/bdx-insight-ci.yml"]
  pull_request:
    paths: ["bdx-insight-ai/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bdx-insight-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bdx-insight-ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
