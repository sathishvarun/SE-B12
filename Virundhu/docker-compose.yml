# Local development stack.
#   Only database + Redis (use with uvicorn / npm run dev on your Mac):  docker compose up -d db redis
#   Everything in Docker:                                                  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: virundhu
      POSTGRES_PASSWORD: virundhu
      POSTGRES_DB: virundhu
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virundhu -d virundhu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://virundhu:virundhu@db:5432/virundhu
      REDIS_URL: redis://redis:6379/0
    ports: ["8450:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://virundhu:virundhu@db:5432/virundhu
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    command: ["arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8450
    ports: ["5450:80"]
    depends_on: [backend]

volumes:
  pgdata:
  redisdata:
