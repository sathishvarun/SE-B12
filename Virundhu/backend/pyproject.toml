[project]
name = "virundhu-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]  # B008: FastAPI Depends() pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
