name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: virundhu, POSTGRES_PASSWORD: virundhu, POSTGRES_DB: virundhu }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U virundhu" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg2://virundhu:virundhu@localhost:5432/virundhu
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      SUPERADMIN_PASSWORD: ci-admin-password
      DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
