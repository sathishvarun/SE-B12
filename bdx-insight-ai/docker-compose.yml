# Local run with Docker:  docker compose up --build   ->  http://localhost:8501
services:
  bdx-insight:
    build: .
    container_name: bdx-insight
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data      # users, sessions, usage log and the knowledge index survive rebuilds
    restart: unless-stopped
